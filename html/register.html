<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tạo tài khoản Luxury Cars.">
    <title>Đăng ký - Luxury Cars</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html#home" aria-label="Luxury Cars - Trang chủ">
                    <img src="/assets/images/logocar.png" alt="Luxury Cars" width="48" height="48">
                    <span>Luxury Cars</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation" aria-expanded="false" aria-label="Mở menu điều hướng">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html#home">Trang chủ</a></li>
                        <li class="nav-item"><a class="nav-link" href="collection.html">Bộ sưu tập</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Liên hệ</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Đăng nhập</a></li>
                        <li class="nav-item"><a class="nav-link active" href="register.html" aria-current="page">Đăng ký</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section id="dangky" class="bg-white">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-sm-10 col-md-7 col-lg-5">
                        <div class="card shadow-sm">
                            <div class="card-body p-4">
                                <h1 class="h3 text-center fw-bold mb-4">Tạo tài khoản</h1>
                                <form method="post">
                                    <div class="mb-3">
                                        <label for="registerName" class="form-label">Họ và tên</label>
                                        <input type="text" class="form-control" id="registerName" name="name"
                                            autocomplete="name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerEmail" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="registerEmail" name="email"
                                            autocomplete="email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="registerPassword" class="form-label">Mật khẩu</label>
                                        <input type="password" class="form-control" id="registerPassword" name="password"
                                            autocomplete="new-password" minlength="8" required>
                                        <div class="form-text">Mật khẩu cần có ít nhất 8 ký tự.</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                                        <input type="password" class="form-control" id="confirmPassword"
                                            name="confirmPassword" autocomplete="new-password" minlength="8" required>
                                    </div>
                                    <button type="submit" class="btn btn-danger w-100">Đăng ký</button>
                                </form>
                                <p class="text-center text-secondary mt-3 mb-0">
                                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white">
        <div class="container py-3 text-center">
            <p class="mb-0">&copy; 2026 Luxury Cars. All rights reserved.</p>
        </div>
    </footer>
    <script src="/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
